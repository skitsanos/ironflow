[package]
name = "ironflow"
version = "1.17.0-dev.2"
edition = "2024"
description = "Lightweight workflow engine — Rust core, Lua scripting, single binary"
license = "MIT"
repository = "https://github.com/skitsanos/ironflow"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
mlua = { version = "0.12.0", features = ["lua54", "async", "serialize", "send", "vendored"] }
tree-sitter = "0.26.11"
tree-sitter-lua = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
noyalib = { version = "0.0.28", features = ["compat-serde-yaml"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
prometheus-client = "0.25.0"
reqwest = { version = "0.13.4", features = ["json", "stream", "multipart"] }
url = "2.5.8"
http = "1"
rmcp = { version = "3.0.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
aws-config = "1.8.18"
aws-sdk-s3 = { version = "1.135.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-s3vectors = { version = "1.27.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = "1.4.9"
csv = "1.4.0"
jsonschema = "0.49"
num_cpus = "1.17.0"
dotenvy = "0.15.7"
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4.3"
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
base64 = "0.23.0"
comrak = { version = "0.54", default-features = false }
html2md = "0.2.15"
ammonia = "4.1.2"
zip = "8.6.0"
quick-xml = "0.41.0"
calamine = { version = "0.36", default-features = false, features = ["dates"] }
lopdf = { version = "0.44", default-features = false, features = ["chrono"] }
image = { version = "0.25.10", default-features = false, features = [
    "bmp", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
pdfium-render = "0.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "any", "sqlite"] }
futures-util = "0.3"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
redis = { version = "1.2", features = ["aio", "tokio-comp", "connection-manager"], optional = true }

[features]
default = ["pdf-render"]
pdf-render = []
postgres = ["sqlx/postgres"]
redis = ["dep:redis"]

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = "0.5"
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[[example]]
name = "extraction_benchmark_worker"
path = "tools/extraction_benchmark_worker.rs"
