name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  # Verify the tag was pushed on the main branch
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        run: |
          TAG_SHA=$(git rev-list -n 1 ${{ github.ref }})
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch. Releases must be tagged on main."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform.target }}${{ matrix.suffix }}
    needs: guard
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        # Each target is built twice: default features and the "-full"
        # variant with the postgres and redis storage backends and the bundled
        # CJK font.
        suffix: ["", "-full"]
        platform:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.platform.target }}${{ matrix.suffix }}
          cache-workspace-crates: false

      - name: Install musl tools (Linux)
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.platform.target }} ${{ matrix.suffix == '-full' && '--features postgres,redis,cjk-fonts' || '' }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar czf ironflow-${{ github.ref_name }}-${{ matrix.platform.target }}${{ matrix.suffix }}.tar.gz assets/fonts/OFL.txt -C target/${{ matrix.platform.target }}/release ironflow

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.platform.target }}/release/ironflow.exe", "assets/fonts/OFL.txt" -DestinationPath "ironflow-${{ github.ref_name }}-${{ matrix.platform.target }}${{ matrix.suffix }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ironflow-${{ matrix.platform.target }}${{ matrix.suffix }}
          path: ironflow-${{ github.ref_name }}-${{ matrix.platform.target }}${{ matrix.suffix }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ironflow-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/ironflow-*
            artifacts/checksums-sha256.txt

  container:
    name: Publish container version tags
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-release.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
