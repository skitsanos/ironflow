name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify the tag was pushed on the main branch
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        run: |
          TAG_SHA=$(git rev-list -n 1 ${{ github.ref }})
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch. Releases must be tagged on main."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}${{ matrix.artifact_suffix }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            artifact_suffix: ""
            cache_key: release-x86_64-unknown-linux-musl-default
            save_cache: true
            rustflags: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            artifact_suffix: "-full"
            cache_key: release-x86_64-unknown-linux-musl-full
            save_cache: true
            rustflags: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact_suffix: ""
            cache_key: release-x86_64-apple-darwin-default
            save_cache: true
            rustflags: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact_suffix: "-full"
            cache_key: release-x86_64-apple-darwin-full
            save_cache: true
            rustflags: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact_suffix: ""
            cache_key: release-aarch64-apple-darwin-default
            save_cache: true
            rustflags: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact_suffix: "-full"
            cache_key: release-aarch64-apple-darwin-full
            save_cache: true
            rustflags: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            artifact_suffix: ""
            cache_key: release-x86_64-pc-windows-msvc
            save_cache: false
            rustflags: -Dwarnings
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            artifact_suffix: "-full"
            cache_key: release-x86_64-pc-windows-msvc
            save_cache: false
            rustflags: -Dwarnings

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache_key }}
          cache-workspace-crates: false
          save-if: ${{ matrix.save_cache }}

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build default release binary
        if: matrix.artifact_suffix == ''
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build full release binary
        if: matrix.artifact_suffix == '-full'
        run: cargo build --release --target ${{ matrix.target }} --features postgres,redis

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ironflow-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz ironflow
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/ironflow.exe" -DestinationPath "ironflow-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ironflow-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: ironflow-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ironflow-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/ironflow-*
            artifacts/checksums-sha256.txt
