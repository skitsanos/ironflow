name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Verify the tag was pushed on the main branch
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        run: |
          TAG_SHA=$(git rev-list -n 1 ${{ github.ref }})
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch. Releases must be tagged on main."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}${{ matrix.suffix }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Each target is built twice: default features and the "-full"
        # variant with postgres and redis storage backends.
        suffix: ["", "-full"]
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}${{ matrix.suffix }}
          cache-workspace-crates: false

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.suffix == '-full' && '--features postgres,redis' || '' }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar czf ironflow-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}.tar.gz -C target/${{ matrix.target }}/release ironflow

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/ironflow.exe" -DestinationPath "ironflow-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ironflow-${{ matrix.target }}${{ matrix.suffix }}
          path: ironflow-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ironflow-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/ironflow-*
            artifacts/checksums-sha256.txt
