name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Only allow PRs from develop into main
  branch-guard:
    name: Branch guard
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Only the 'develop' branch can be merged into 'main'. Got '$HEAD_REF'."
            exit 1
          fi

  module-size:
    name: Module size ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test module-size checker
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Enforce production module-size policy
        run: python3 -B scripts/check_module_size.py

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo check --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets -- -D warnings

  full-features:
    name: Full feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo check --all-targets --features postgres,redis

  redis-tests:
    name: Redis integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      IRONFLOW_REDIS_TEST_URL: redis://127.0.0.1:6379
      IRONFLOW_REDIS_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --features redis --test test_redis_atomicity -- --test-threads=1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --all-targets

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --release

  validate-examples:
    name: Validate example flows
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --release
      - name: Validate all example flows
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            echo "Validating $f..."
            if ! ./target/release/ironflow validate "$f"; then
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find examples -type f -name '*.lua' -print0)
          exit $failed
      - name: Verify example contracts, catalog, fixtures, and offline matrix
        run: >-
          cargo test
          --test test_example_catalog
          --test test_example_contracts
          --test test_example_fixtures
