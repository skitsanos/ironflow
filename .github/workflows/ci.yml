name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/**"
      - "scripts/**"
      - ".cargo/audit.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  module-size:
    name: Module size ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test module-size checker
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Enforce production module-size policy
        run: python3 -B scripts/check_module_size.py

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on any advisory not in the reviewed ignore list at .cargo/audit.toml.
      - name: Audit dependencies
        run: cargo audit

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo check --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets -- -D warnings

  full-features:
    name: Full feature check and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo check --all-targets --features postgres,redis
      - run: cargo clippy --all-targets --features postgres,redis -- -D warnings

  redis-tests:
    name: Redis integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      IRONFLOW_REDIS_TEST_URL: redis://127.0.0.1:6379
      IRONFLOW_REDIS_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --all-targets --features redis -- --test-threads=1

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ironflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ironflow-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ironflow-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/ironflow_test
      IRONFLOW_POSTGRES_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --all-targets --features postgres -- --test-threads=1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --all-targets

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --release

  validate-examples:
    name: Validate example flows
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --release
      - name: Validate all example flows
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            echo "Validating $f..."
            if ! ./target/release/ironflow validate "$f"; then
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find examples -type f -name '*.lua' -print0)
          exit $failed
      - name: Verify example contracts, catalog, fixtures, and offline matrix
        run: >-
          cargo test
          --test test_example_catalog
          --test test_example_contracts
          --test test_example_fixtures
