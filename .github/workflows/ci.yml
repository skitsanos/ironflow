name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - ".claude/**"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - ".claude/**"
      - ".gitignore"
  workflow_dispatch:

# Superseded pull-request runs are cancelled; pushes to main and develop
# always run to completion so their caches and artifacts stay intact.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun run scripts/validate_skills.ts
      - run: bun run scripts/issues_registry.ts check
      - run: bun test scripts/tests/*.test.ts
      - name: Test repository hooks and module-size checker
        run: |
          python3 -B -m unittest discover -s .codex/hooks/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Enforce production module-size policy
        run: python3 -B scripts/check_module_size.py
      - name: Check hook and gate script syntax
        run: |
          sh -n .githooks/pre-commit
          bash -n .githooks/pre-push scripts/integration_gate.sh
      - name: Lint workflows
        uses: raven-actions/actionlint@v2

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on every vulnerability or informational warning not in the
      # reviewed ignore list at .cargo/audit.toml.
      - name: Audit dependencies
        run: cargo audit --deny warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-default:
    name: Clippy and tests (ubuntu-latest)
    runs-on: ubuntu-latest
    # Keep linked test artifacts within hosted-runner disk and memory limits.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  rust-features:
    name: Full feature checks and storage tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ironflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ironflow-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      IRONFLOW_REDIS_TEST_URL: redis://127.0.0.1:6379
      IRONFLOW_REDIS_TEST_REQUIRED: "1"
      DATABASE_URL: postgres://postgres:ironflow-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/ironflow_test
      IRONFLOW_POSTGRES_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets --features postgres,redis -- -D warnings
      - run: cargo test --all-targets --features postgres,redis -- --test-threads=1

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --all-targets

  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --release
      - name: Upload Linux release binary
        uses: actions/upload-artifact@v7
        with:
          name: ironflow-linux-release-${{ github.sha }}
          path: target/release/ironflow
          if-no-files-found: error
          retention-days: 1

  validate-examples:
    name: Validate example flows
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux release binary
        uses: actions/download-artifact@v8
        with:
          name: ironflow-linux-release-${{ github.sha }}
          path: target/release
      - name: Validate all example flows
        run: |
          chmod +x ./target/release/ironflow
          failed=0
          while IFS= read -r -d '' f; do
            echo "Validating $f..."
            if ! ./target/release/ironflow validate "$f"; then
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find examples -type f -name '*.lua' -print0)
          exit $failed
