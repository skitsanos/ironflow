name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/**"
      - "scripts/**"
      - ".cargo/audit.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/container.yml"
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  module-size:
    name: Module size ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test module-size checker
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Enforce production module-size policy
        run: python3 -B scripts/check_module_size.py

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on every vulnerability or informational warning not in the
      # reviewed ignore list at .cargo/audit.toml.
      - name: Audit dependencies
        run: cargo audit --deny warnings

  rust-default:
    name: Clippy and tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  rust-features:
    name: Full feature checks and storage tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ironflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ironflow-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      IRONFLOW_REDIS_TEST_URL: redis://127.0.0.1:6379
      IRONFLOW_REDIS_TEST_REQUIRED: "1"
      DATABASE_URL: postgres://postgres:ironflow-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/ironflow_test
      IRONFLOW_POSTGRES_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets --features postgres,redis -- -D warnings
      - run: cargo test --all-targets --features postgres,redis -- --test-threads=1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --all-targets

  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --release
      - name: Upload Linux release binary
        uses: actions/upload-artifact@v7
        with:
          name: ironflow-linux-release-${{ github.sha }}
          path: target/release/ironflow
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --release

  windows-release-cache:
    name: Prime Windows release dependency cache
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-pc-windows-msvc
          cache-workspace-crates: false
      - name: Prime default and full release dependencies
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc --features postgres,redis

  validate-examples:
    name: Validate example flows
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux release binary
        uses: actions/download-artifact@v8
        with:
          name: ironflow-linux-release-${{ github.sha }}
          path: target/release
      - name: Validate all example flows
        run: |
          chmod +x ./target/release/ironflow
          failed=0
          while IFS= read -r -d '' f; do
            echo "Validating $f..."
            if ! ./target/release/ironflow validate "$f"; then
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find examples -type f -name '*.lua' -print0)
          exit $failed
