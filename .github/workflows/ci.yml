name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - ".claude/settings.json"
      - ".claude/hooks/**"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - ".claude/settings.json"
      - ".claude/hooks/**"
      - ".gitignore"
  workflow_dispatch:

# Validation needs read access only; jobs that publish declare their own grants.
permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes to main and develop
# always run to completion so their caches and artifacts stay intact.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun run scripts/validate_skills.ts
      - run: bun run scripts/issues_registry.ts check
      - run: bun test scripts/tests/*.test.ts
      - name: Test repository hooks, scripts and the module-size checker
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Enforce production module-size policy
        run: python3 -B scripts/check_module_size.py
      - name: Check hook and gate script syntax
        run: |
          sh -n .githooks/pre-commit
          bash -n .githooks/pre-push scripts/integration_gate.sh
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on every vulnerability or informational warning not in the
      # reviewed ignore list at .cargo/audit.toml.
      - name: Audit dependencies
        run: cargo audit --deny warnings
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Fails on copyleft-only, unparsable, or missing licenses anywhere in the
      # shipped dependency graph; the allowlist lives in scripts/check_licenses.ts.
      - name: Check dependency licenses
        run: bun --no-env-file scripts/check_licenses.ts

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-default:
    name: Clippy and tests (ubuntu-latest)
    runs-on: ubuntu-latest
    # Keep linked test artifacts small on hosted runners.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets -- -D warnings
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun --no-env-file scripts/test_rust_targets.ts
      - run: cargo test --doc

  rust-features:
    name: Full feature checks and storage tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ironflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ironflow-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      IRONFLOW_REDIS_TEST_URL: redis://127.0.0.1:6379
      IRONFLOW_REDIS_TEST_REQUIRED: "1"
      DATABASE_URL: postgres://postgres:ironflow-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/ironflow_test
      IRONFLOW_POSTGRES_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets --features postgres,redis,cjk-fonts -- -D warnings
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Only the binaries with feature-gated tests: storage backends, the TLS
      # boundary, the CLI and scheduler cases behind `postgres`, and the CJK
      # document renders. The default job already ran everything else.
      - run: bun --no-env-file scripts/test_rust_targets.ts --features postgres,redis,cjk-fonts --test storage --test storage_postgres --test storage_redis --test library_tls_boundaries --test cli --test scheduler --test documents -- --test-threads=1
      - name: TLS-only storage and certificate rejection
        run: bun --no-env-file scripts/test_store_tls.ts target/debug/ironflow

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Pull requests cover the areas where macOS differs (files, paths,
      # processes, archives and the CLI); pushes and dispatch run the whole suite.
      - name: Platform-sensitive areas
        if: github.event_name == 'pull_request'
        run: bun --no-env-file scripts/test_rust_targets.ts --test nodes --test cli --test engine --test serial
      - name: Full suite
        if: github.event_name != 'pull_request'
        run: bun --no-env-file scripts/test_rust_targets.ts

  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    # The release build and the example loop below validate what a push ships;
    # pull requests already load every Lua example through the `examples` tests.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: false
      - run: cargo build --release
      - name: Upload Linux release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ironflow-linux-release-${{ github.sha }}
          path: target/release/ironflow
          if-no-files-found: error
          retention-days: 1

  validate-examples:
    name: Validate example flows
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Linux release binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ironflow-linux-release-${{ github.sha }}
          path: target/release
      - name: Validate all example flows
        run: |
          chmod +x ./target/release/ironflow
          failed=0
          while IFS= read -r -d '' f; do
            echo "Validating $f..."
            if ! ./target/release/ironflow validate "$f"; then
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find examples -type f -name '*.lua' -print0)
          exit $failed
