events {}

http {
    access_log off;

    upstream ironflow_replicas {
        server ironflow-a:3000;
        server ironflow-b:3000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://ironflow_replicas;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header X-IronFlow-Upstream $upstream_addr always;
        }
    }
}
