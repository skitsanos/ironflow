name: ironflow-replica-acceptance

x-ironflow: &ironflow
  build:
    context: ../..
    dockerfile: Dockerfile
    args:
      FEATURES: postgres redis
  user: "1001230000:0"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &ironflow-environment
    IRONFLOW_STORE: postgres
    IRONFLOW_STORE_URL: postgres://postgres@postgres/ironflow
    IRONFLOW_EVENT_STORE: postgres
    IRONFLOW_EVENT_STORE_URL: postgres://postgres@postgres/ironflow
    IRONFLOW_REPLICA_MODE: "true"
    IRONFLOW_SHUTDOWN_GRACE_SECONDS: "2"
    IRONFLOW_MAX_CONCURRENT_RUNS: "8"
    IRONFLOW_ARTIFACT_BACKEND: s3
    IRONFLOW_ARTIFACT_DIR: /tmp/ironflow-artifacts
    IRONFLOW_ARTIFACT_S3_BUCKET: artifacts
    IRONFLOW_ARTIFACT_S3_PREFIX: replica-acceptance
    IRONFLOW_ARTIFACT_S3_REGION: us-east-1
    IRONFLOW_ARTIFACT_S3_ENDPOINT_URL: http://minio:9000
    IRONFLOW_ARTIFACT_S3_FORCE_PATH_STYLE: "true"
    AWS_ACCESS_KEY_ID: acceptance
    AWS_SECRET_ACCESS_KEY: acceptance-secret
    RUST_LOG: ironflow=info
  volumes:
    - ../../examples/22-replica-deployment:/data/flows:ro
    - ../../examples/22-replica-deployment/ironflow.yaml:/data/ironflow.yaml:ro
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/health/ready"]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ironflow
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ironflow"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: acceptance
      MINIO_ROOT_PASSWORD: acceptance-secret
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set acceptance http://minio:9000 acceptance acceptance-secret &&
        mc mb --ignore-existing acceptance/artifacts

  ironflow-a:
    <<: *ironflow
    ports:
      - "127.0.0.1:3101:3000"

  ironflow-b:
    <<: *ironflow
    ports:
      - "127.0.0.1:3102:3000"

  proxy:
    image: nginx:1.31-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:3100:8080"
    depends_on:
      ironflow-a:
        condition: service_healthy
      ironflow-b:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
