apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ironflow-canary
  labels:
    app.kubernetes.io/name: ironflow
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ironflow-canary
  labels:
    app.kubernetes.io/name: ironflow
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  runPolicy: SerialLatestOnly
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 2
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      buildArgs:
        - name: FEATURES
          value: postgres
  output:
    to:
      kind: ImageStreamTag
      name: ironflow-canary:latest
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "3"
      memory: 8Gi
  completionDeadlineSeconds: 1800
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ironflow-canary-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironflow-canary-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: ironflow-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: ironflow-canary
        app.kubernetes.io/part-of: ironflow-openshift-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: ironflow
            - name: POSTGRESQL_DATABASE
              value: ironflow
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ironflow-canary-secrets
                  key: database-password
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ironflow-canary-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: ironflow-canary-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: ironflow-canary
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironflow-canary
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"ironflow-canary:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"ironflow\")].image"}]
  labels:
    app.kubernetes.io/name: ironflow
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  replicas: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ironflow
      app.kubernetes.io/instance: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ironflow
        app.kubernetes.io/instance: canary
        app.kubernetes.io/part-of: ironflow-openshift-canary
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ironflow
                    app.kubernetes.io/instance: canary
      containers:
        - name: ironflow
          image: ironflow-canary:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: IRONFLOW_STORE
              value: postgres
            - name: IRONFLOW_EVENT_STORE
              value: postgres
            - name: IRONFLOW_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: ironflow-canary-secrets
                  key: database-url
            - name: IRONFLOW_EVENT_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: ironflow-canary-secrets
                  key: database-url
            - name: IRONFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ironflow-canary-secrets
                  key: api-key
            - name: IRONFLOW_REPLICA_MODE
              value: "true"
            - name: IRONFLOW_SHUTDOWN_GRACE_SECONDS
              value: "5"
            - name: RUST_LOG
              value: info
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ironflow-canary
  labels:
    app.kubernetes.io/name: ironflow
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  selector:
    app.kubernetes.io/name: ironflow
    app.kubernetes.io/instance: canary
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ironflow-canary
  labels:
    app.kubernetes.io/name: ironflow
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  to:
    kind: Service
    name: ironflow-canary
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ironflow-canary
  labels:
    app.kubernetes.io/name: ironflow
    app.kubernetes.io/part-of: ironflow-openshift-canary
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ironflow
      app.kubernetes.io/instance: canary
