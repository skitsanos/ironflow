# All previous transitive advisory exceptions were retired during the
# 2026-09-28 release review (IF-040). Trust-store fixes must remain in the
# resolved dependency graph, including rustls-webpki >= 0.103.16.
# Keep the audit fail-closed; do not reintroduce exceptions without review.
#
# The SQLite exception for RUSTSEC-2026-0459 (IF-173) was retired on
# 2026-11-18: sqlx 0.9.1 resolves libsqlite3-sys 0.40.0, which bundles SQLite
# 3.54.1.
#
# One reviewed exception is active (IF-231, reviewed 2026-11-18):
#
# RUSTSEC-2026-0543 (chrono 0.4.45) reports the crate as unmaintained. It
# names no vulnerability and has no patched version.
#
# Why it is not fixed: IronFlow's own time handling moved to jiff (IF-231,
# finished 2026-11-18), but the cron crate evaluates schedules over chrono
# types, so chrono remains in the graph. IronFlow's only use is
# src/scheduler/cron_boundary.rs, which exchanges wall-clock values with cron
# and enables no chrono feature.
#
# Exposure: none known. IronFlow parses and formats no date with chrono.
#
# Exit: remove the entry when cron and its IronFlow adapter no longer resolve
# chrono, or when the advisory is withdrawn. scripts/tests/repository_policy.test.ts fails if
# the entry outlives the crate, if another crate resolves chrono, if a chrono
# feature is enabled here, or if another module imports it. Review again by
# 2026-12-17.
[advisories]
ignore = ["RUSTSEC-2026-0543"]
